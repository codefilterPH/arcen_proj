{% extends 'layouts/base.html' %}
{% load static %}

{% load static %}

{% block extra_css %}
<style>
    body {
        background: #0f172a;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    .scanner-card {
        background: #020617;
        border-radius: 12px;
        padding: 1.25rem;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    #qr-reader {
        width: 100%;
        border-radius: 10px;
        overflow: hidden;
    }

    .status {
        text-align: center;
        margin-top: 0.75rem;
        font-weight: 600;
    }

    .status.success { color: #22c55e; }
    .status.error   { color: #ef4444; }
</style>
{% endblock %}

{% block content %}
<div class="scanner-card">
    <h5 class="text-center mb-3">📷 Scan QR Code</h5>

    <div id="qr-reader"></div>

    <div id="scan-status" class="status">
        Waiting for QR code…
    </div>
    <div id="result" class="mt-2 fw-semibold text-info"></div>

    <div id="studentCard" class="card mt-3 d-none">
        <div class="card-body">
            <div class="d-flex gap-3">
                <img id="studentPhoto"
                     src=""
                     alt="Photo"
                     style="width:80px;height:80px;object-fit:cover;border-radius:8px;">

                <div>
                    <div><strong>Name:</strong> <span id="studentName">—</span></div>
                    <div><strong>Rank:</strong> <span id="studentRank">—</span></div>
                    <div><strong>Class:</strong> <span id="studentClass">—</span></div>
                    <div><strong>Contact:</strong> <span id="studentContact">—</span></div>
                    <div><strong>Address:</strong> <span id="studentAddress">—</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-grid mt-3">
        <button id="restartScan" class="btn btn-outline-secondary btn-sm d-none">
            Scan Again
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- REQUIRED: html5-qrcode -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
$(function () {
    console.log("jQuery OK:", typeof $);

    const $statusBox = $("#scan-status");
    const $restartBtn = $("#restartScan");
    const csrfToken = $("meta[name='csrf-token']").attr("content");

    let qrScanner = null;

    function startScanner() {
        $statusBox.text("Opening camera…").removeClass("success error");

        qrScanner = new Html5Qrcode("qr-reader");

        qrScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
            function () {}
        ).catch(() => {
            $statusBox.text("Camera access denied or unavailable.")
                      .addClass("error");
        });
    }

    function onScanSuccess(decodedText) {
        $statusBox.text("QR detected. Processing…");
        qrScanner.stop();

        $.ajax({
            url: "{% url 'scan_qr' %}",
            type: "POST",
            contentType: "application/json",
            headers: { "X-CSRFToken": csrfToken },
            data: JSON.stringify({ qr_data: decodedText }),

            success: function (res) {
                if (res.success) {
                    $statusBox.text("✔ Scan successful").addClass("success");
                } else {
                    $statusBox.text(res.message || "Scan failed").addClass("error");
                }
                $restartBtn.removeClass("d-none");
            },

            error: function () {
                $statusBox.text("Server error").addClass("error");
                $restartBtn.removeClass("d-none");
            }
        });
    }

    $restartBtn.on("click", function () {
        $(this).addClass("d-none");
        startScanner();
    });

    startScanner();
});
</script>
{% endblock %}
