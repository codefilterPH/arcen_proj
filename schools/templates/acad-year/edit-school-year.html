{% load static %}

<!-- Edit School Year Modal -->
<div class="modal fade" id="editSchoolYearModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-md">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-edit me-2 text-warning"></i> Edit School Year
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <form id="editSchoolYearForm">
        {% csrf_token %}
        <div class="modal-body">
          <input type="hidden" id="editYearId" name="id">

          <div class="mb-3">
            <label for="editYearName" class="form-label fw-semibold">
              Name <span class="text-danger">*</span>
            </label>
            <input type="text" id="editYearName" name="name"
                   class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="editYearStart" class="form-label fw-semibold">
              Start Date <span class="text-danger">*</span>
            </label>
            <input type="date" id="editYearStart" name="start_date"
                   class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="editYearEnd" class="form-label fw-semibold">
              End Date <span class="text-danger">*</span>
            </label>
            <input type="date" id="editYearEnd" name="end_date"
                   class="form-control" required>
          </div>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button"
                  id="btnCancelEditYear"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i> Cancel
          </button>
          <button type="submit" class="btn btn-warning">
            <i class="fas fa-save me-1"></i> Update Year
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
<script src="{% static 'js/acad-years/edit-years.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  initializeEditSchoolYearForm();

  const editModalEl = document.getElementById("editSchoolYearModal");
  const settingsModalEl = document.getElementById("schoolSettingsModal");

  const editModal = bootstrap.Modal.getOrCreateInstance(editModalEl);
  const settingsModal = bootstrap.Modal.getOrCreateInstance(settingsModalEl);

  // When opening Edit modal → hide parent settings modal
  editModalEl.addEventListener("show.bs.modal", function () {
    settingsModal.hide();
  });

  // When closing Edit modal → reopen settings modal
  editModalEl.addEventListener("hidden.bs.modal", function () {
    settingsModal.show();
  });

});
</script>
