{% load static %}

<!-- Add School Year Modal -->
<div class="modal fade" id="addSchoolYearModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-md">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-calendar-plus me-2 text-success"></i> Add School Year
        </h5>
        <button type="button" class="btn-close" id="btnCancelAddYear"
        data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <form id="addSchoolYearForm" method="post">
        {% csrf_token %}
        <div class="modal-body">

          <!-- Name -->
          <div class="mb-3">
            <label for="yearName" class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
            <input type="text" id="yearName" name="name" class="form-control" placeholder="e.g. 2025–2026" required>
          </div>

          <!-- Start Date -->
          <div class="mb-3">
            <label for="yearStart" class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
            <input type="date" id="yearStart" name="start_date" class="form-control" required>
          </div>

          <!-- End Date -->
          <div class="mb-3">
            <label for="yearEnd" class="form-label fw-semibold">End Date <span class="text-danger">*</span></label>
            <input type="date" id="yearEnd" name="end_date" class="form-control" required>
          </div>

        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelAddYear">
            <i class="fas fa-times me-1"></i> Cancel
          </button>
          <button type="submit" class="btn btn-success">
            <i class="fas fa-save me-1"></i> Save Year
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
{% block extra_js %}
<script src="{% static 'js/acad-years/add-years.js' %}"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const addModalEl = document.getElementById("addSchoolYearModal");
  const settingsModalEl = document.getElementById("schoolSettingsModal");

  const addModal = bootstrap.Modal.getOrCreateInstance(addModalEl);
  const settingsModal = bootstrap.Modal.getOrCreateInstance(settingsModalEl);

  // When opening Add School Year → hide settings
  addModalEl.addEventListener("show.bs.modal", function () {
    settingsModal.hide();
  });

  // When closing Add School Year → reopen settings
  addModalEl.addEventListener("hidden.bs.modal", function () {
    settingsModal.show();
  });

});
</script>
{% endblock %}
