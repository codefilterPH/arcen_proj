{% load static %}
<!-- 🔹 QR Scanner Modal -->
<div class="modal fade" id="qrScannerModal" tabindex="-1" aria-labelledby="qrScannerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="qrScannerModalLabel">
          <i class="fas fa-qrcode me-2"></i> QR Code Scanner
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body bg-light">

        <!-- Camera Selector -->
        <div id="cameraChooser" class="mb-3" style="display:none;">
          <label class="fw-semibold mb-1">Select Camera</label>
          <select id="cameraSelect" class="form-select"></select>
          <button class="btn btn-primary w-100 mt-2" onclick="startSelectedCamera()">
            <i class="fas fa-video me-1"></i> Start Scanner
          </button>
        </div>

        <!-- QR Reader -->
        <div class="text-center mb-3">
          <div id="reader" style="width:100%; max-width:400px; margin:0 auto;"></div>
          <div id="result" class="mt-3 text-muted">
            Select a camera and start scanning
          </div>
        </div>
        <!-- Camera Toggle -->
        <div class="d-flex justify-content-center mt-2">
          <button id="toggleCameraBtn"
                  class="btn btn-outline-primary btn-sm"
                  type="button"
                  onclick="toggleCamera()">
            <i class="fas fa-sync-alt me-1"></i> Switch Camera
          </button>
        </div>

        <!-- Student Card -->
        <div id="studentCard" class="card shadow-sm mx-auto" style="max-width:550px; display:none;">
          <div class="card-body text-center">

            <img id="studentPhoto"
                 src="{% static 'img/users/img_holder.png' %}"
                 class="rounded-circle mb-3"
                 style="width:120px; height:120px; object-fit:cover; border:3px solid #0d6efd;">

            <h4 class="fw-bold mb-3">Scanned Information</h4>

            <div class="text-start mb-3 ps-3">
              <p><strong>Name:</strong> <span id="studentName">—</span></p>
              <p><strong>Rank:</strong> <span id="studentRank">—</span></p>
              <p><strong>Classification:</strong> <span id="studentClass">—</span></p>
              <p><strong>Contact No.:</strong> <span id="studentContact">—</span></p>
              <p><strong>Address:</strong> <span id="studentAddress">—</span></p>
            </div>

            <div class="mb-3">
              <label class="fw-bold mb-1">Attendance Status</label>
              <select id="attendanceStatus" class="form-select text-center fw-bold">
                <option value="PRESENT" selected>Present</option>
                <option value="LATE">Late</option>
                <option value="ABSENT">Absent</option>
                <option value="EXCUSED">Excused</option>
                <option value="DISMISSED">Dismissed</option>
              </select>
            </div>

            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-success" onclick="confirmAttendance()">
                <i class="fas fa-check me-1"></i> Confirm
              </button>
              <button class="btn btn-danger" onclick="cancelAttendance()">
                <i class="fas fa-times me-1"></i> Cancel
              </button>
            </div>

          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-1"></i> Close
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="{% static 'attendance/js/submit-attendance.js' %}"></script>
<script src="{% static 'attendance/js/qrscanner.js' %}"></script>

<script>
$(function () {

  $("#qrScannerModal").on("shown.bs.modal", function () {
      if (window.initQrScanner) {
          initQrScanner();
      }
  });

  $("#qrScannerModal").on("hidden.bs.modal", function () {
      if (window.stopQrScanner) {
          stopQrScanner();
      }

      $("#cameraChooser").hide();
      $("#studentCard").hide();
      $("#result").text("Select a camera and start scanning");

      $("#studentPhoto").attr("src", "{% static 'img/users/img_holder.png' %}");
      $("#studentName, #studentRank, #studentClass, #studentContact, #studentAddress").text("—");
  });

});
</script>
